name: repository-foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-contracts-and-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check staged source boundary
        run: python scripts/check_repository.py
      - name: Validate public requirements and schema
        run: python scripts/check_project_docs.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
