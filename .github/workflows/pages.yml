name: Deploy public catalog to GitHub Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: catalog-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'copypasteltd/Hottest-animation-clones' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: web/catalog
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Check expected project-site path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: test "${PAGES_BASE_PATH%/}" = '/Hottest-animation-clones'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check catalog types
        run: npm run check
      - name: Test catalog behavior
        run: npm test
      - name: Build synthetic public catalog only
        run: npm run build:pages
      - name: Audit the publish directory
        run: node scripts/output.mjs pages
      - name: Upload only the audited site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/catalog/dist-pages
          retention-days: 1

  deploy:
    if: github.repository == 'copypasteltd/Hottest-animation-clones' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy audited artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
