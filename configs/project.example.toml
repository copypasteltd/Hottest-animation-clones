# Portable design example. Copy to the ignored project.local.toml for local settings.
[project]
root = "."
document_root = "docs"

[paths]
sources = "media/sources"
standard_assets = "standard-assets"
workflows = "workflows"
runs = "runs"
run_notes = "docs/runs"
outputs = "outputs"

[source]
downloader = "ra-video-download"
platforms = ["bilibili", "x", "douyin"]
input_scope = "whole_video"

[target]
scene_id = "scene-s02-white-grid"
default_variants = ["SA02", "BM01"]

[workflow]
# Relative to the designated 4090 ComfyUI root.
workflow_directory = "user/default/workflows/社区精选H3_人物与场景替换_实验"

[execution]
mode = "local"
allow_network = false
allow_remote_generation = false
allow_model_download = false

[secrets]
# Reference environment variable names rather than credential values.
remote_endpoint_env = "AI_MOTION_REMOTE_ENDPOINT"
remote_token_env = "AI_MOTION_REMOTE_TOKEN"
